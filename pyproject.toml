[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "three-vehicle-convoy"
version = "0.1.0"
description = "Deterministic kinematic bicycle convoy simulation"
requires-python = ">=3.10"
dependencies = ["numpy==2.2.6", "matplotlib==3.10.3", "pillow==12.3.0"]

[project.optional-dependencies]
mpc = ["casadi==3.7.2"]
test = ["pytest==8.4.1"]

[tool.setuptools.packages.find]
include = ["convoy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
