<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Leadhaul convoy promo renderer</title>
<style>
  :root { --teal: #19d3c5; --amber: #ffb020; --red: #ff4d4d; --ink: #0b1014; --panel: rgba(9, 13, 17, 0.74); }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  #c { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  #hud { position: absolute; inset: 0; pointer-events: none; font-family: 'Inter', sans-serif; color: #fff;
         -webkit-font-smoothing: antialiased; }
  #hud svg { position: absolute; inset: 0; }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.38) 100%); }
  .letterbox { position: absolute; left: 0; right: 0; height: 0; background: #000; }
  #fade { position: absolute; inset: 0; background: #000; opacity: 0; }

  .chip { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; font-size: 19px; font-weight: 600;
          letter-spacing: 0.02em; padding: 7px 12px 7px 12px; border-radius: 7px; background: var(--panel);
          border: 1px solid rgba(255,255,255,0.14); box-shadow: 0 6px 20px rgba(0,0,0,0.35); }
  .chip .role { font-weight: 500; opacity: 0.78; margin-left: 6px; }
  .chip .tele { display: block; font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 500; opacity: 0.9; margin-top: 3px; }
  .chip.lead { border-left: 4px solid var(--amber); }
  .chip.auto { border-left: 4px solid var(--teal); }
  .chip.hold { border-left: 4px solid var(--red); }
  .chip::after { content: ''; position: absolute; left: 50%; bottom: -9px; width: 1px; height: 9px; background: rgba(255,255,255,0.6); }

  .lower { position: absolute; left: 96px; bottom: 92px; max-width: 1180px; }
  .lower .kicker { font-size: 20px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--teal); margin-bottom: 12px; }
  .lower .line { font-size: 46px; font-weight: 700; line-height: 1.16; letter-spacing: -0.01em; text-shadow: 0 2px 18px rgba(0,0,0,0.55); }
  .lower .sub { font-size: 25px; font-weight: 500; line-height: 1.38; margin-top: 14px; opacity: 0.92; text-shadow: 0 2px 12px rgba(0,0,0,0.6); }
  .lower .src { font-size: 15px; font-weight: 500; opacity: 0.62; margin-top: 10px; letter-spacing: 0.02em; }

  .panel { position: absolute; right: 80px; top: 150px; width: 560px; background: var(--panel); border-radius: 14px;
           border: 1px solid rgba(255,255,255,0.12); padding: 26px 30px 12px 30px; box-shadow: 0 14px 40px rgba(0,0,0,0.4); }
  .panel h3 { margin: 0 0 16px 0; font-size: 17px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--teal); }
  .item { margin-bottom: 20px; }
  .item .t { font-size: 25px; font-weight: 700; line-height: 1.22; }
  .item .d { font-size: 18px; font-weight: 500; opacity: 0.8; margin-top: 5px; line-height: 1.35; }
  .item .m { font-family: 'JetBrains Mono', monospace; font-size: 17px; color: var(--teal); margin-top: 6px; }

  .badge { position: absolute; font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 600; letter-spacing: 0.12em;
           padding: 7px 12px; border-radius: 6px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); }
  #sim { left: 40px; top: 36px; }
  #speed { right: 40px; top: 36px; color: var(--teal); }
  #clock { left: 40px; top: 80px; opacity: 0.8; }

  #log { position: absolute; right: 80px; top: 150px; width: 600px; background: var(--panel); border-radius: 14px;
         border: 1px solid rgba(255,255,255,0.12); padding: 22px 26px 14px 26px; }
  #log h3 { margin: 0 0 12px 0; font-size: 17px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--red); }
  #log .row { font-family: 'JetBrains Mono', monospace; font-size: 18px; line-height: 1.5; margin-bottom: 6px; display: flex; gap: 14px; }
  #log .row .ts { opacity: 0.6; min-width: 92px; }
  #chartbox { position: absolute; right: 80px; bottom: 80px; width: 600px; height: 250px; background: var(--panel);
              border-radius: 14px; border: 1px solid rgba(255,255,255,0.12); }
  #chartbox .cap { position: absolute; left: 22px; top: 14px; font-size: 15px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.75; }

  .card { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
  .card .logo { font-size: 128px; font-weight: 800; letter-spacing: 0.16em; margin-left: 0.16em; }
  .card .logo span { color: var(--teal); }
  .card .tag { font-size: 44px; font-weight: 600; margin-top: 18px; letter-spacing: -0.005em; }
  .card .desc { font-size: 26px; font-weight: 500; opacity: 0.82; margin-top: 22px; }
  .card .foot { font-family: 'JetBrains Mono', monospace; font-size: 18px; opacity: 0.6; margin-top: 54px; letter-spacing: 0.06em; }

  .stats { position: absolute; left: 96px; right: 96px; bottom: 120px; display: flex; gap: 28px; }
  .stat { flex: 1; background: var(--panel); border-radius: 14px; border: 1px solid rgba(255,255,255,0.12); padding: 26px 28px 24px 28px; }
  .stat .n { font-size: 62px; font-weight: 800; letter-spacing: -0.02em; color: #fff; }
  .stat .n span { color: var(--teal); }
  .stat .l { font-size: 21px; font-weight: 500; opacity: 0.85; margin-top: 8px; line-height: 1.32; }
  .stats-title { position: absolute; left: 96px; top: 110px; font-size: 54px; font-weight: 800; letter-spacing: -0.01em; text-shadow: 0 2px 18px rgba(0,0,0,0.5); }
  .stats-title small { display: block; font-size: 24px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--teal); margin-bottom: 14px; }
  .note { position: absolute; left: 96px; bottom: 60px; font-size: 15px; opacity: 0.55; }
</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="hud">
  <div class="vignette"></div>
  <svg id="svg" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
  <div id="chips"></div>
  <div id="dim" style="position:absolute;inset:0;background:#05080a;opacity:0"></div>
  <div id="fade"></div>
  <div id="layers"></div>
  <div class="badge" id="sim">SIMULATION</div>
  <div class="badge" id="clock"></div>
  <div class="badge" id="speed"></div>
  <div class="letterbox" id="lbt" style="top:0"></div>
  <div class="letterbox" id="lbb" style="bottom:0"></div>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
